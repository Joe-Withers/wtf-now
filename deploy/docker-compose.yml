# Private access through Tailscale. The app shares the sidecar's network, so
# nothing is exposed on the server's public interface.
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: wtf-now
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  app:
    build:
      context: ..
    network_mode: service:tailscale
    env_file: ../.env
    environment:
      GIT_SSH_COMMAND: ssh -i /run/keys/bundle -o StrictHostKeyChecking=accept-new
    volumes:
      - data:/data
      - ./bundle-key:/run/keys/bundle:ro
    depends_on:
      - tailscale
    restart: unless-stopped

volumes:
  data:
  tailscale:
